{{define "header"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {{if .AutoRefresh}}<meta http-equiv="refresh" content="5">{{end}}
  <title>{{.Title}} — Bridge</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
{{if .Authenticated}}
<nav class="topnav">
  <span class="brand">Bridge</span>
  <a href="/">Dashboard</a>
  <a href="/library">Library</a>
  <a href="/inbox">Inbox</a>
  <a href="/activity">Activity</a>
  <a href="/swarm">Swarm</a>
  <a href="/settings">Settings</a>
  <form method="post" action="/logout" class="logout-form">
    <button type="submit" class="link-button">Log out</button>
  </form>
</nav>
{{end}}
<main class="content">
{{if .Error}}<div class="flash flash-error">{{.Error}}</div>{{end}}
{{if .Notice}}<div class="flash flash-notice">{{.Notice}}</div>{{end}}
{{end}}
{{define "footer"}}
</main>
</body>
</html>
{{end}}
