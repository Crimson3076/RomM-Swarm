name: CI

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build commands
        run: make build

      # The Phase 0 acceptance harness runs entirely offline against recorded
      # fixtures and synthesised ROM images. It must stay green without network
      # access or a live RomM instance.
      - name: Phase 0 evidence
        run: go test -run TestPhase0 -v ./...

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t romm-swarm-bridge:ci .

      # No live RomM server here, consistent with the rest of CI — this only
      # proves the image boots, serves the admin UI unconfigured, and that
      # -healthcheck (what Docker's own HEALTHCHECK runs, since the runtime
      # image has no shell) reports healthy.
      - name: Boot and check /healthz
        run: |
          docker run -d --name bridge-smoke -p 8080:8080 romm-swarm-bridge:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/healthz > /dev/null; then
              echo "healthz ok"
              break
            fi
            if [ "$i" -eq 20 ]; then
              echo "bridge never became healthy"
              docker logs bridge-smoke
              exit 1
            fi
            sleep 1
          done
          docker exec bridge-smoke /bridge -healthcheck -addr :8080

      - name: Stop container
        if: always()
        run: docker rm -f bridge-smoke || true
