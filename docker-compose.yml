# Runs the Bridge admin daemon (ADR 0015). All configuration — the RomM
# connection, the admin password, the destination mode — can be set through
# the web UI's /setup flow once this is up; ROMM_URL/ROMM_TOKEN below are an
# optional first-boot convenience, not a requirement.
services:
  bridge:
    build: .
    image: romm-swarm-bridge:dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Persistent state: config.json, the transfer journal, and staged
      # in-flight transfers. Must survive container recreation.
      - bridge-data:/data
      # Optional: files here are importable through the admin UI's Inbox
      # page without a double-transfer through the browser. Point this at
      # wherever ROMs land before they're catalogued.
      - ${BRIDGE_INBOX_HOST_DIR:-./inbox}:/inbox:ro
    environment:
      BRIDGE_CONFIG_DIR: /data
      BRIDGE_LISTEN_ADDR: :8080
      BRIDGE_INBOX_DIR: /inbox
      # Optional first-boot seed — leave unset to configure entirely through
      # /setup instead. Only takes effect if /data/config.json doesn't exist
      # yet.
      ROMM_URL: ${ROMM_URL:-}
      ROMM_TOKEN: ${ROMM_TOKEN:-}
      # Optional first-boot seed for joining a Swarm without going through
      # the admin UI's /swarm page — leave both unset to join manually.
      SWARM_HOST_URL: ${SWARM_HOST_URL:-}
      SWARM_INVITATION_CODE: ${SWARM_INVITATION_CODE:-}
      # Reference catalogues are no longer configured on the Bridge at all
      # (ADR 0023): the Swarm owner uploads them once through the Host's
      # web UI, and every joined Bridge fetches the current set
      # automatically before each publish attempt.
      # Optional tuning for a RomM server that isn't on the same local
      # network as this Bridge, where every list/download request is
      # markedly slower than the 30s/5min defaults assume. Raise either if
      # a publish fails with "context deadline exceeded" partway through a
      # scan. Leave unset for the built-in defaults (2 minutes per HTTP
      # request, 30 minutes per whole publish attempt).
      BRIDGE_ROMM_HTTP_TIMEOUT_SECONDS: ${BRIDGE_ROMM_HTTP_TIMEOUT_SECONDS:-}
      BRIDGE_PUBLISH_TIMEOUT_MINUTES: ${BRIDGE_PUBLISH_TIMEOUT_MINUTES:-}

  # Network Host (ADR 0016, slice 1): accounts, Swarms, memberships,
  # invitations, Bridge enrollment/rotation/revocation. Independent of the
  # bridge service above — nothing here talks to a real cmd/bridge yet
  # (see ADR 0016's "explicitly out of scope"). Complete /api/setup once
  # this is up to create the owner account.
  host:
    build:
      context: .
      dockerfile: Dockerfile.host
    image: romm-swarm-host:dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"
      - "8082:8082"
    environment:
      HOST_LISTEN_ADDR: :8081
      HOST_UI_LISTEN_ADDR: :8082
      HOST_DATABASE_URL: postgres://host:${HOST_POSTGRES_PASSWORD:-host}@postgres:5432/host?sslmode=disable

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: host
      POSTGRES_PASSWORD: ${HOST_POSTGRES_PASSWORD:-host}
      POSTGRES_DB: host
    volumes:
      - host-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U host"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs the whole test suite, including the Postgres-gated host/... tests,
  # with no requirement on the host machine beyond Docker itself — no local
  # Go toolchain, no local Postgres install. Reuses the same postgres
  # service the host container uses; hoststoretest.OpenDB gives each test
  # its own throwaway schema within it, so sharing the database is safe.
  # Non-Alpine image deliberately: -race needs cgo, and golang:*-alpine has
  # no C toolchain installed, unlike the Debian-based image.
  # Usage: docker compose run --rm test
  #
  # profiles keeps this out of a plain `docker compose up`/`up --build` —
  # without it, up would try to start this as a normal long-running
  # service too, running the suite once and then sitting stopped.
  # `docker compose run` targets a named service regardless of profiles,
  # so the usage above is unaffected.
  test:
    image: golang:1.24
    profiles: ["tools"]
    working_dir: /src
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # :Z relabels the bind mount for this container's exclusive use under
      # SELinux (enforcing by default on Fedora) — without it, the source
      # tree is mounted but unreadable inside the container.
      - .:/src:Z
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    environment:
      TEST_POSTGRES_DSN: postgres://host:${HOST_POSTGRES_PASSWORD:-host}@postgres:5432/host?sslmode=disable
    command: go test ./... -race

volumes:
  bridge-data:
  host-postgres-data:
  go-mod-cache:
  go-build-cache:
