{{define "secret_display"}}{{template "header" .}}
<div class="page-heading"><div><p class="eyebrow">{{.SwarmName}}</p><h1>{{.Heading}}</h1></div></div>
<div class="card">
  <p>{{.Notice}}</p>
  <pre class="code-display">{{.Secret}}</pre>
  <button type="button" id="copy-secret">Copy code</button>
  <span id="copy-status" role="status" aria-live="polite"></span>
</div>
<p><a href="/swarms/{{.SwarmID}}">Back to {{.SwarmName}}</a></p>
<script src="/static/host.js" defer></script>
{{template "footer" .}}{{end}}
