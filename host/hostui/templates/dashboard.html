{{define "dashboard"}}{{template "header" .}}
<h1>Dashboard</h1>

<div class="card">
  <h2>Swarms</h2>
  {{if .Swarms}}
  <table class="table">
    <thead><tr><th>Name</th><th></th></tr></thead>
    <tbody>
    {{range .Swarms}}
      <tr><td>{{.Name}}</td><td><a href="/swarms/{{.ID}}">View</a></td></tr>
    {{end}}
    </tbody>
  </table>
  {{else}}
  <p>No Swarms yet.</p>
  {{end}}
</div>

<div class="card">
  <h2>Create a Swarm</h2>
  <form method="post" action="/swarms" class="form">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" required autofocus>
    <button type="submit">Create Swarm</button>
  </form>
</div>
{{template "footer" .}}{{end}}
